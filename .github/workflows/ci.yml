name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src --configuration Release
      - name: Tests
        run: dotnet test --solution src/Hotelly.slnx --configuration Release --no-build
