name: CI
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
    branches:
      - main
      - release-*
  pull_request:
  workflow_dispatch:
  release:
    types: [created]
env:
  DOTNET_NOLOGO: true
jobs:
  build:
    name: Build and test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src --configuration Release
      - name: Tests
        run: dotnet test src --configuration Release --no-build
      - name: Upload packages
        if: matrix.name == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: nugets/
          retention-days: 2
  release-to-feedz:
    needs: build
    name: Release to Feedz.io
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: nugets/
      - name: Push package to Feedz.io
        run: dotnet nuget push ./nugets/*.nupkg --source https://f.feedz.io/mauroservienti/pre-releases/nuget --api-key ${{ secrets.FEEDZ_API_KEY }}
      - name: Push symbols to Feedz.io
        run: dotnet nuget push ./nugets/*.snupkg --source https://f.feedz.io/mauroservienti/pre-releases/symbols --api-key ${{ secrets.FEEDZ_API_KEY }}
  release-to-nuget:
    needs: build
    name: Release to Nuget.org
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: nugets/
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package to NuGet.org
        run: dotnet nuget push ./nugets/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
